<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Planet Tvale — A New World. Your Legend.</title>

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://knight-panther.github.io/space-counter/" />
    <meta property="og:title"       content="Planet Tvale — A New World. Your Legend." />
    <meta property="og:description" content="An epic space adventure where you explore planets, build your empire, and rule the realm. Available on Google Play &amp; App Store." />
    <meta property="og:image"       content="https://knight-panther.github.io/space-counter/preview.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Planet Tvale — A New World. Your Legend." />
    <meta name="twitter:description" content="An epic space adventure where you explore planets, build your empire, and rule the realm." />
    <meta name="twitter:image"       content="https://knight-panther.github.io/space-counter/preview.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { height: 100%; background: #000011; }
      body {
        background: #000011;
        overflow: hidden;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        /* Push content away from notch / home bar on iOS and Android gesture nav */
        padding-top:    env(safe-area-inset-top,    0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left:   env(safe-area-inset-left,   0px);
        padding-right:  env(safe-area-inset-right,  0px);
      }
      /* Game container — full width on phone, capped on desktop */
      #game-container {
        width: 100%;
        max-width: 480px;
        height: 100%;
        position: relative;
        flex-shrink: 0;
      }
      canvas { display: block; }

      /* ── Loading screen ───────────────────────────────────────── */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #000011;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }

      #loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: 68%;
        max-width: 300px;
      }

      #loading-label {
        font-family: 'Orbitron', Arial, sans-serif;
        font-size: 17px;
        font-weight: 700;
        color: #00ff66;
        letter-spacing: 7px;
        animation: lbl-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes lbl-pulse {
        from { opacity: 0.55; }
        to   { opacity: 1.00; }
      }

      #loading-track {
        width: 100%;
        height: 7px;
        background: #05130a;
        border-radius: 4px;
        border: 1px solid #003318;
        overflow: hidden;
      }

      #loading-bar {
        height: 100%;
        width: 0%;
        border-radius: 4px;
        background: linear-gradient(90deg, #00cc44, #39ff88);
        box-shadow: 0 0 10px #00ff66, 0 0 3px #00ff66;
        animation: bar-fill 4.5s cubic-bezier(0.25, 0.1, 0.1, 1) forwards;
      }
      /* Fills to ~90% and holds — game dismisses it when ready */
      @keyframes bar-fill {
        0%   { width:  0%; }
        50%  { width: 70%; }
        80%  { width: 86%; }
        100% { width: 92%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-inner">
        <div id="loading-label">LOADING</div>
        <div id="loading-track"><div id="loading-bar"></div></div>
      </div>
    </div>

    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
